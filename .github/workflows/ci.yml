name: Running Coach checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: running-coach-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    name: Existing 29 regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e 'apps/api[test]'
      - name: GPX analysis (15 tests)
        run: python -m unittest discover -s apps/api/tests -p 'test_analysis.py' -v
      - name: Coaching (7 tests)
        run: python -m unittest discover -s apps/api/tests -p 'test_coaching.py' -v
      - name: Auth and storage security (7 tests)
        run: python -m unittest discover -s apps/api/tests -p 'test_security.py' -v
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -e 'apps/api[test]'
      - run: python -m unittest discover -s apps/api/tests -v
        env:
          MODE: test
          PYTHONPATH: apps/api
      - run: npm ci
      - name: Single-service beta process lifecycle
        run: python scripts/test-supervisor.py
      - run: npm run typecheck
      - run: npm run test:rls
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/web/test-results
